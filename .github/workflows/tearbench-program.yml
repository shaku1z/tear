name: TearBench Evidence Program

on:
  # Weekly endurance evidence that no other workflow runs: check:weekly plus the TearBench
  # selection over the complete history. The nightly group runs daily in nightly.yml.
  schedule:
    - cron: "23 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tearbench-program-${{ github.ref }}
  cancel-in-progress: false

jobs:
  weekly-endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run retained endurance evidence
        shell: bash
        run: |
          mkdir -p artifacts/tearbench
          root_commit="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          git diff --name-only "$root_commit" HEAD > artifacts/tearbench/changed-files.txt
          pnpm tearbench ci --files-from artifacts/tearbench/changed-files.txt --artifact artifacts/tearbench/weekly-ci-selection.json
          pnpm check:weekly
      - uses: actions/upload-artifact@v4
        with:
          name: tearbench-weekly-${{ github.sha }}
          path: artifacts/tearbench
          if-no-files-found: error
          retention-days: 30
