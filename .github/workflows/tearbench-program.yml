name: TearBench Evidence Program

on:
  # Weekly. The selected evidence is the scenario and journey set
  # that pull requests no longer run; the static checks run on every pull request.
  schedule:
    - cron: "17 6 * * 0"
    - cron: "23 8 * * 0"
  workflow_dispatch:
    inputs:
      profile:
        description: Evidence profile (none of these profiles certifies a release)
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - weekly-endurance

permissions:
  contents: read

concurrency:
  group: tearbench-program-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 6 * * 0') || inputs.profile == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Select and run complete protected-history evidence
        shell: bash
        run: |
          mkdir -p artifacts/tearbench
          root_commit="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          git diff --name-only "$root_commit" HEAD > artifacts/tearbench/changed-files.txt
          pnpm tearbench select --files-from artifacts/tearbench/changed-files.txt --artifact artifacts/tearbench/nightly-selection.json
          pnpm tearbench ci --files-from artifacts/tearbench/changed-files.txt --artifact artifacts/tearbench/nightly-ci-selection.json
      - uses: actions/upload-artifact@v4
        with:
          name: tearbench-nightly-${{ github.sha }}
          path: artifacts/tearbench
          if-no-files-found: error
          retention-days: 14

  weekly-endurance:
    if: (github.event_name == 'schedule' && github.event.schedule == '23 8 * * 0') || inputs.profile == 'weekly-endurance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run retained endurance evidence
        shell: bash
        run: |
          mkdir -p artifacts/tearbench
          root_commit="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          git diff --name-only "$root_commit" HEAD > artifacts/tearbench/changed-files.txt
          pnpm tearbench ci --files-from artifacts/tearbench/changed-files.txt --artifact artifacts/tearbench/weekly-ci-selection.json
          pnpm check:weekly
      - uses: actions/upload-artifact@v4
        with:
          name: tearbench-weekly-${{ github.sha }}
          path: artifacts/tearbench
          if-no-files-found: error
          retention-days: 30
