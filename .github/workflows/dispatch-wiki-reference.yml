name: Manual wiki reference proof

on:
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Successful protected-main Validate run ID whose exact reference artifact should be dispatched
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require protected main ref
        env:
          WORKFLOW_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != "refs/heads/main" || "$REF_PROTECTED" != "true" ]]; then
            echo 'Manual wiki reference proof requires protected main.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dispatch the exact validated reference artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WIKI_DEPLOY_TOKEN: ${{ secrets.WIKI_DEPLOY_TOKEN }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: node scripts/dispatch-wiki-reference.mjs --validation-run-id "$VALIDATION_RUN_ID"
