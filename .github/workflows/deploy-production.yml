name: Deploy Cloudflare Production

on:
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Successful main Validate run ID whose exact artifact will be deployed
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
      url: https://tearblade.com
    steps:
      - name: Resolve successful main validation evidence
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.validation_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > validation.json
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync, mkdirSync, writeFileSync } from "node:fs";
          const run = JSON.parse(readFileSync("validation.json", "utf8"));
          const errors = [];
          if (run.name !== "Validate") errors.push(`workflow ${run.name} is not Validate`);
          if (run.event !== "push" || run.head_branch !== "main") errors.push("validation is not a main push");
          if (run.conclusion !== "success") errors.push(`conclusion ${run.conclusion} is not success`);
          if (run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY) errors.push("validation belongs to another repository");
          if (!/^[0-9a-f]{40}$/.test(run.head_sha)) errors.push("validation has no full head SHA");
          if (errors.length) throw new Error(errors.join("; "));
          mkdirSync("artifacts/release", { recursive: true });
          writeFileSync("artifacts/release/validation.json", `${JSON.stringify({
            format: "tear-release-evidence", schemaVersion: 1,
            repository: process.env.GITHUB_REPOSITORY, sha: run.head_sha,
            validationWorkflow: "Validate", validationConclusion: run.conclusion,
            validationRunId: String(run.id),
          }, null, 2)}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${run.head_sha}\nrun_id=${run.id}\n`);
          NODE
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore validation evidence after clean checkout
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.validation.outputs.run_id }}
          RELEASE_SHA: ${{ steps.validation.outputs.sha }}
        shell: bash
        run: |
          mkdir -p artifacts/release
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          writeFileSync("artifacts/release/validation.json", `${JSON.stringify({
            format: "tear-release-evidence", schemaVersion: 1,
            repository: process.env.GITHUB_REPOSITORY, sha: process.env.RELEASE_SHA,
            validationWorkflow: "Validate", validationConclusion: "success",
            validationRunId: process.env.RUN_ID,
          }, null, 2)}\n`);
          NODE
      - name: Prove clean main equals validated origin/main
        env:
          TEAR_RELEASE_EVIDENCE: artifacts/release/validation.json
          TEAR_RELEASE_SHA: ${{ steps.validation.outputs.sha }}
        run: pnpm release:preflight
      - uses: actions/download-artifact@v4
        with:
          name: tear-release-targets-${{ steps.validation.outputs.sha }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ steps.validation.outputs.run_id }}
      - name: Verify exact validated standalone artifact
        env:
          TEAR_RELEASE_SHA: ${{ steps.validation.outputs.sha }}
        run: pnpm release:verify-artifact
      - name: Deploy exact attributed artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ steps.validation.outputs.sha }}
          VALIDATION_RUN_ID: ${{ steps.validation.outputs.run_id }}
        shell: bash
        run: >-
          pnpm exec wrangler deploy --config wrangler.jsonc
          --message "production git:${RELEASE_SHA} validate:${VALIDATION_RUN_ID}"
      - name: Dispatch the deployed revision to the wiki
        env:
          WIKI_DEPLOY_TOKEN: ${{ secrets.WIKI_DEPLOY_TOKEN }}
          GAME_COMMIT: ${{ steps.validation.outputs.sha }}
        shell: bash
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${WIKI_DEPLOY_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\":\"tear-game-deployed\",\"client_payload\":{\"game_commit\":\"${GAME_COMMIT}\"}}" \
            https://api.github.com/repos/shaku1z/tear-wiki/dispatches
