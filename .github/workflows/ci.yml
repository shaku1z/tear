name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prove release preflight rejects unsafe repository states
        run: node --test tests/release-preflight.test.mjs
      - name: Select and run diff-aware TearBench evidence
        shell: bash
        run: |
          mkdir -p artifacts/tearbench
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > artifacts/tearbench/changed-files.txt
          else
            git diff --name-only "${{ github.sha }}^" "${{ github.sha }}" > artifacts/tearbench/changed-files.txt
          fi
          pnpm tearbench ci --files-from artifacts/tearbench/changed-files.txt
      - name: Check game-reference artifact publication contract
        run: pnpm test:game-reference-artifact
      - run: xvfb-run -a pnpm check:functional
      # This step is intentionally after the full functional gate and has no
      # always() condition. A failed Validate run cannot publish a reference.
      - name: Publish exact game-reference manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TEAR_GAME_REFERENCE_ARTIFACT_NAME: tear-game-reference-v1-${{ github.sha }}
        run: pnpm publish:game-reference
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tear-game-reference-v1-${{ github.sha }}
          path: artifacts/game-reference
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: tear-release-targets-${{ github.sha }}
          path: |
            dist
            artifacts/tear-crazygames.zip
            artifacts/tearbench
          if-no-files-found: error
          retention-days: 14
