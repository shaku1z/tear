name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Preserve the complete functional command set while leaving bounded
    # headroom for shared-runner variance; this is not a latency improvement.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve focused validation scope
        id: validation-scope
        shell: bash
        run: |
          mkdir -p artifacts/tearbench
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > artifacts/tearbench/changed-files.txt
          else
            before="${{ github.event.before }}"
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
              git diff --name-only "$before" "${{ github.sha }}" > artifacts/tearbench/changed-files.txt
            else
              git show --format= --name-only "${{ github.sha }}" > artifacts/tearbench/changed-files.txt
            fi
          fi
          gameplay_required=true
          if [[ "${{ github.event_name }}" == "pull_request" ]] && node --input-type=module -e 'import { readFileSync } from "node:fs"; const files = readFileSync("artifacts/tearbench/changed-files.txt", "utf8").split(/\r?\n/u).filter(Boolean); process.exit(files.length > 0 && files.every((file) => /^(?:docs\/|plans\/|(?:README|CONTRIBUTING|CRAZYGAMES|DEPLOYMENT)\.md$)/u.test(file)) ? 0 : 1)'; then
            gameplay_required=false
          fi
          echo "gameplay_required=$gameplay_required" >> "$GITHUB_OUTPUT"
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.validation-scope.outputs.gameplay_required == 'true'
      - name: Prove release preflight rejects unsafe repository states
        if: steps.validation-scope.outputs.gameplay_required == 'true'
        run: node --test tests/release-preflight.test.mjs
      - name: Select and run diff-aware TearBench evidence
        run: pnpm tearbench ci --files-from artifacts/tearbench/changed-files.txt
      - name: Validate documentation-only authority and terminology
        if: steps.validation-scope.outputs.gameplay_required == 'false'
        run: pnpm check:docs && pnpm test:docs && pnpm check:terminology && pnpm test:terminology && pnpm requirements:check
      - name: Check game-reference artifact publication contract
        if: steps.validation-scope.outputs.gameplay_required == 'true'
        run: pnpm test:game-reference-artifact
      - run: xvfb-run -a pnpm check:functional
        if: steps.validation-scope.outputs.gameplay_required == 'true'
      - uses: actions/upload-artifact@v4
        if: steps.validation-scope.outputs.gameplay_required == 'true'
        with:
          name: tear-release-targets-${{ github.sha }}
          path: |
            dist
            artifacts/packages/tear-crazygames.zip
            artifacts/tearbench
          if-no-files-found: error
          retention-days: 14
      # This step is intentionally after the full functional gate and has no
      # always() condition. A failed Validate run cannot publish a reference.
      - name: Publish exact game-reference manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TEAR_GAME_REFERENCE_ARTIFACT_NAME: tear-game-reference-v1-${{ github.sha }}
        run: pnpm publish:game-reference
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tear-game-reference-v1-${{ github.sha }}
          path: artifacts/game-reference
          if-no-files-found: error
          retention-days: 90
