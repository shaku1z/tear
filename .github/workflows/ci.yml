name: Validate

# Draft pull requests do not run: a draft cannot be merged, and each run costs
# included Actions minutes. Marking a pull request ready starts a run; start one
# on a draft by hand with "Run workflow" if needed.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Runs on main are never
  # cancelled: each one may produce the build a deploy needs.
  group: validate-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # Measured: an ordinary run takes 24-26 minutes, and a pull request that touches many tests
    # took about 34 (7.5 for the diff-selected evidence, 22+ for check:functional). 45 leaves
    # about a third over the worst measured run; reduce it when the duplicated step goes.
    timeout-minutes: 45
    steps:
      # A pull request is checked as its head merged with main as main is now,
      # not GitHub's prepared merge ref, which a re-run reuses and a reopen can
      # serve stale. "pnpm merge:ready" reads the recorded pair to decide whether
      # a pass is still current.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Merge current main into the change
        if: github.event_name != 'push'
        shell: bash
        run: |
          git fetch --quiet origin main
          git -c user.name=validate -c user.email=validate@invalid merge --quiet --no-edit origin/main ||
            { echo "::error::This change does not merge cleanly with current main. Bring it up to date."; exit 1; }
      - name: Record what was checked
        id: checked
        shell: bash
        run: |
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          main="$(git rev-parse origin/main)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "::notice title=checked::head=$head main=$main"
          echo "Checked head \`$head\` merged with main \`$main\`." >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A pull request that changes only documents runs the document checks
      # instead of the game checks. Every push to main runs everything.
      - name: Resolve focused validation scope
        id: validation-scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          gameplay_required=true
          if [[ "$EVENT" != "push" ]] && git diff --name-only origin/main HEAD | node -e 'const files = require("fs").readFileSync(0, "utf8").split(/\r?\n/u).filter(Boolean); process.exit(files.length > 0 && files.every((file) => /^(?:docs\/|plans\/|wiki\/|(?:README|CONTRIBUTING|CRAZYGAMES|DEPLOYMENT|AGENTS|CLAUDE)\.md$|config\/position\.json$|\.github\/pull_request_template\.md$)/u.test(file)) ? 0 : 1)'; then
            gameplay_required=false
          fi
          echo "gameplay_required=$gameplay_required" >> "$GITHUB_OUTPUT"
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.validation-scope.outputs.gameplay_required == 'true'
      - name: Prove release preflight rejects unsafe repository states
        if: steps.validation-scope.outputs.gameplay_required == 'true'
        run: node --test tests/release-preflight.test.mjs
      - name: Validate documentation-only authority and terminology
        if: steps.validation-scope.outputs.gameplay_required == 'false'
        run: pnpm check:docs && pnpm test:docs && pnpm check:terminology && pnpm test:terminology && pnpm requirements:check && pnpm wiki:test
      # The wiki reads the game exporter (src/game-reference), so game changes run its tests too.
      - name: Wiki tests
        if: steps.validation-scope.outputs.gameplay_required == 'true'
        run: pnpm wiki:test
      - run: xvfb-run -a pnpm check:functional
        if: steps.validation-scope.outputs.gameplay_required == 'true'
      - uses: actions/upload-artifact@v4
        if: steps.validation-scope.outputs.gameplay_required == 'true'
        with:
          # Named after the commit actually built, which build-info.json records.
          name: tear-release-targets-${{ steps.checked.outputs.commit }}
          # Deploys use dist/standalone. The CrazyGames package is the storefront
          # upload. A deploy of a build older than this needs a re-run of its
          # Validate run (docs/RELEASE_AUTHORITY.md).
          path: |
            dist/standalone
            artifacts/packages/tear-crazygames.zip
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 7 || 2 }}
