name: Validate

# Draft pull requests do not run: a draft cannot be merged, and each run costs
# included Actions minutes. Marking a pull request ready starts a run; start one
# on a draft by hand with "Run workflow" if needed.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Runs on main are never
  # cancelled: each one may produce the build a deploy needs.
  group: validate-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # Preserve the complete functional command set while leaving bounded
    # headroom for shared-runner variance; this is not a latency improvement.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A pull request that changes only documents runs the document checks
      # instead of the game checks. Every push to main runs everything.
      - name: Resolve focused validation scope
        id: validation-scope
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          gameplay_required=true
          if [[ -n "$BASE" ]] && git diff --name-only "$BASE" HEAD | node -e 'const files = require("fs").readFileSync(0, "utf8").split(/\r?\n/u).filter(Boolean); process.exit(files.length > 0 && files.every((file) => /^(?:docs\/|plans\/|(?:README|CONTRIBUTING|CRAZYGAMES|DEPLOYMENT|AGENTS|CLAUDE)\.md$|config\/position\.json$|\.github\/pull_request_template\.md$)/u.test(file)) ? 0 : 1)'; then
            gameplay_required=false
          fi
          echo "gameplay_required=$gameplay_required" >> "$GITHUB_OUTPUT"
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.validation-scope.outputs.gameplay_required == 'true'
      - name: Prove release preflight rejects unsafe repository states
        if: steps.validation-scope.outputs.gameplay_required == 'true'
        run: node --test tests/release-preflight.test.mjs
      - name: Validate documentation-only authority and terminology
        if: steps.validation-scope.outputs.gameplay_required == 'false'
        run: pnpm check:docs && pnpm test:docs && pnpm check:terminology && pnpm test:terminology && pnpm requirements:check
      - name: Check game-reference artifact publication contract
        if: steps.validation-scope.outputs.gameplay_required == 'true'
        run: pnpm test:game-reference-artifact
      - run: xvfb-run -a pnpm check:functional
        if: steps.validation-scope.outputs.gameplay_required == 'true'
      - uses: actions/upload-artifact@v4
        if: steps.validation-scope.outputs.gameplay_required == 'true'
        with:
          name: tear-release-targets-${{ github.sha }}
          # Deploys use dist/standalone. The CrazyGames package is the storefront
          # upload. A deploy of a build older than this needs a re-run of its
          # Validate run (docs/RELEASE_AUTHORITY.md).
          path: |
            dist/standalone
            artifacts/packages/tear-crazygames.zip
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 7 || 2 }}
      # This step is intentionally after the full functional gate and has no
      # always() condition. A failed Validate run cannot publish a reference.
      - name: Publish exact game-reference manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TEAR_GAME_REFERENCE_ARTIFACT_NAME: tear-game-reference-v1-${{ github.sha }}
        run: pnpm publish:game-reference
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tear-game-reference-v1-${{ github.sha }}
          path: artifacts/game-reference
          if-no-files-found: error
          retention-days: 90
