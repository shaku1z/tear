name: Validate

# Draft pull requests do not run: a draft cannot be merged, and each run costs
# included Actions minutes. Marking a pull request ready starts a run; start one
# on a draft by hand with "Run workflow" if needed.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Runs on main are never
  # cancelled: each one may produce the build a deploy needs.
  group: validate-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # From measurement: the gate groups in config/checks.json record about 20 minutes on a
    # runner and setup (install, browser download) about 3; the last full run on this list took
    # about 25. The limit stays at least twice the recorded total, which tests/unit/ci-workflow
    # checks, so a slow runner is not cut off and a hung check still stops.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A pull request that changes only documents runs the document checks
      # instead of the game checks. Every push to main runs everything.
      - name: Resolve focused validation scope
        id: validation-scope
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          gameplay_required=true
          if [[ -n "$BASE" ]] && git diff --name-only "$BASE" HEAD | node -e 'const files = require("fs").readFileSync(0, "utf8").split(/\r?\n/u).filter(Boolean); process.exit(files.length > 0 && files.every((file) => /^(?:docs\/|plans\/|wiki\/|(?:README|CONTRIBUTING|CRAZYGAMES|DEPLOYMENT|AGENTS|CLAUDE)\.md$|config\/position\.json$|\.github\/pull_request_template\.md$)/u.test(file)) ? 0 : 1)'; then
            gameplay_required=false
          fi
          echo "gameplay_required=$gameplay_required" >> "$GITHUB_OUTPUT"
      - name: Check documents only
        if: steps.validation-scope.outputs.gameplay_required == 'false'
        run: pnpm check:docs && pnpm test:docs && pnpm check:terminology && pnpm test:terminology && pnpm requirements:check && pnpm wiki:test
      # The checks in config/checks.json, one step per group in the order they
      # are listed: cheap and likely-to-fail first, so a failure shows within
      # minutes. `pnpm check` runs the same list locally.
      - name: Static checks (format, repository guards, typecheck, lint)
        if: steps.validation-scope.outputs.gameplay_required == 'true'
        run: node scripts/run-checks.mjs static
      - name: Unit tests
        if: steps.validation-scope.outputs.gameplay_required == 'true'
        run: node scripts/run-checks.mjs unit
      - name: Builds
        if: steps.validation-scope.outputs.gameplay_required == 'true'
        run: node scripts/run-checks.mjs build
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.validation-scope.outputs.gameplay_required == 'true'
      - name: Browser checks
        if: steps.validation-scope.outputs.gameplay_required == 'true'
        run: xvfb-run -a node scripts/run-checks.mjs browser
      - uses: actions/upload-artifact@v4
        if: steps.validation-scope.outputs.gameplay_required == 'true'
        with:
          name: tear-release-targets-${{ github.sha }}
          # Deploys use dist/standalone. The CrazyGames package is the storefront
          # upload. A deploy of a build older than this needs a re-run of its
          # Validate run (docs/RELEASE_AUTHORITY.md).
          path: |
            dist/standalone
            artifacts/packages/tear-crazygames.zip
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 7 || 2 }}
