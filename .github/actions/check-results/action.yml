name: Record check results
description: >-
  Each job writes its checks' results to one file per attempt, uploaded as check-results-<job>-<attempt>.
  On a re-run, the newest earlier attempt's file for the same job is fetched first, so a check that
  failed there and passes now on the same tree prints a FLAKY line and a warning. Re-running one
  failed job therefore compares that job alone. Nothing is retried; this only reports.
inputs:
  job:
    description: The job's name in the artifact (static, unit, build, browser-1, ...)
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        JOB: ${{ inputs.job }}
      run: |
        echo "TEAR_CHECK_RESULTS=$RUNNER_TEMP/check-results/results.json" >> "$GITHUB_ENV"
        for ((attempt = GITHUB_RUN_ATTEMPT - 1; attempt >= 1; attempt--)); do
          if gh run download "$GITHUB_RUN_ID" -n "check-results-$JOB-$attempt" -D "$RUNNER_TEMP/previous-check-results" 2>/dev/null; then
            echo "TEAR_CHECK_PREVIOUS=$RUNNER_TEMP/previous-check-results/results.json" >> "$GITHUB_ENV"
            echo "Comparing with attempt $attempt of $JOB."
            exit 0
          fi
        done
        if [[ "$GITHUB_RUN_ATTEMPT" -gt 1 ]]; then echo "No earlier check results for $JOB; this attempt cannot report flaky checks."; fi
