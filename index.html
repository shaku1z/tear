<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/branding/icons/icon-192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TEAR: BLADE</title>
  <!-- TEAR_STANDALONE_PWA_START -->
  <!-- PWA: installable on the standalone site (tearblade.com) -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0a0b10" />
  <link rel="apple-touch-icon" href="/branding/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TEAR" />
  <!-- TEAR_STANDALONE_PWA_END -->
  <!-- Chapter typography: self-hosted (latin subset) so cinematics never make a
       runtime web-font request. Courier/Arial fall back while these load. -->
  <link rel="preload" href="/fonts/BarlowCondensed-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    // Boot failure guard: until the game draws its first frame (which removes #boot),
    // a script that fails to load or an uncaught error swaps the loading line for a
    // readable message instead of leaving a black page.
    (function () {
      var fail = function () {
        var boot = document.getElementById("boot");
        if (boot !== null) boot.className = "failed";
      };
      window.addEventListener("error", function (event) {
        var target = event.target;
        if (event instanceof ErrorEvent || (target && target.tagName === "SCRIPT")) fail();
      }, true);
      window.addEventListener("unhandledrejection", fail);
    })();
  </script>
  <!-- TEAR_PLATFORM_SDK -->
  <style>
    /* Bundled chapter fonts — see fonts/OFL.txt (SIL Open Font License 1.1) */
    @font-face {
      font-family: 'Barlow Condensed'; font-style: normal; font-weight: 600; font-display: swap;
      src: url(/fonts/BarlowCondensed-SemiBold.woff2) format('woff2');
    }
    @font-face {
      font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: swap;
      src: url(/fonts/IBMPlexMono-Regular.woff2) format('woff2');
    }
    @font-face {
      font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: swap;
      src: url(/fonts/IBMPlexMono-Medium.woff2) format('woff2');
    }
    /* EDGE-TO-EDGE: the game IS the page. The canvas fills the whole viewport in every
       context (windowed, fullscreen, the CrazyGames iframe) and the OVERSCAN system
       bleeds the scene into any non-16:9 leftover — so there is never a border, a bar,
       or a page background peeking through. */
    html, body {
      margin: 0;
      height: 100%;
      background: #0a0b10;
      font-family: "Courier New", "Nimbus Mono PS", "Liberation Mono", monospace;
      overflow: hidden;
      /* mobile: the game owns every gesture — no text selection, no pull-to-refresh,
         no back-swipe, no double-tap zoom */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
      touch-action: none;
    }
    #wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    /* invisible probe measuring the hardware safe-area insets (notches / islands);
       the game reads its computed padding and keeps HUD + touch controls inside */
    #safeprobe {
      position: fixed;
      visibility: hidden;
      pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0a0b10;   /* first-frame failsafe only — the game paints every pixel */
      cursor: none;
      image-rendering: auto;
      touch-action: none;    /* mobile: the game owns every gesture (no scroll/zoom) */
    }
    /* DOM chrome over the canvas. The game shows each element only when it applies
       (see src/presentation/dom-chrome-policy.ts); all three start hidden so a first
       paint never shows a stale "capture" box or a control legend. */
    #hint {
      display: none;
      position: absolute;
      left: calc(12px + env(safe-area-inset-left));
      bottom: calc(10px + env(safe-area-inset-bottom));
      max-width: calc(100% - 24px);
      box-sizing: border-box;
      font-size: 12px;
      line-height: 1.5;
      color: #eceaf4;
      background: rgba(10, 11, 16, 0.86);   /* >= 9:1 against the text over any biome */
      border-left: 2px solid #13c4d6;
      padding: 5px 10px;
      pointer-events: none;
      user-select: none;
    }
    #fs {
      position: absolute;
      top: calc(10px + env(safe-area-inset-top));
      right: calc(10px + env(safe-area-inset-right));
      -webkit-appearance: none;
      appearance: none;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 10px;
      margin: 0;
      background: rgba(10, 11, 16, 0.72);
      color: #eceaf4;
      border: 1px solid rgba(19, 196, 214, 0.55);
      border-radius: 2px;
      box-shadow: none;
    }
    #fs:hover, #fs:focus-visible { background: rgba(10, 11, 16, 0.92); border-color: #13c4d6; color: #fff; outline: none; }
    /* Phones and tablets use the platform's own fullscreen and have no hover. */
    @media (pointer: coarse) { #fs { display: none; } }
    #lockhint {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      color: #000;
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid #000;
      padding: 10px 18px;
      pointer-events: none;
      user-select: none;
    }
    /* fullscreen: layout is already edge-to-edge; just drop the page's own chrome */
    #wrap:fullscreen #fs,
    #wrap:fullscreen #hint { display: none !important; }

    /* Loading state: on-brand, local-only, removed after the first game frame. */
    #boot {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #0a0b10;
      color: #f1eff9;
      font-family: "Courier New", "Nimbus Mono PS", "Liberation Mono", monospace;
      pointer-events: none;
    }
    #boot .mark { font-size: 40px; font-weight: bold; letter-spacing: 0.04em; white-space: pre; }
    #boot .line { position: relative; width: 168px; height: 2px; overflow: hidden; background: rgba(241, 239, 249, 0.12); }
    #boot .line::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 56px;
      height: 100%;
      background: #13c4d6;
      animation: tear-boot 1.3s ease-in-out infinite;
    }
    @keyframes tear-boot { from { transform: translateX(-56px); } to { transform: translateX(168px); } }
    @media (prefers-reduced-motion: reduce) {
      #boot .line::after { animation: none; width: 100%; opacity: 0.55; }
    }
    #boot .error { display: none; max-width: 32em; padding: 0 16px; text-align: center; font-size: 14px; line-height: 1.6; color: #c9ccd6; }
    #boot.failed .line { display: none; }
    #boot.failed .error { display: block; pointer-events: auto; }

    #nameInput {
      position: absolute;
      display: none;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit; /* will match game's font */
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
      padding: 0;
      margin: 0;
      /* the JS logic will set top/left/width/height/font-size to match the canvas panel exactly */
    }
    /* Tear owns cursor presentation throughout the game shell. Non-playing screens
       draw the ink arrow on the canvas; gameplay uses the blade reticle. Keeping the
       hardware cursor hidden over DOM controls too prevents either surface from
       appearing underneath a second browser pointer. */
    #wrap, #wrap * { cursor: none; }
    /* The fullscreen button sits above the canvas, where the canvas arrow cannot be
       drawn, so it shows the hardware arrow; the canvas hides its own arrow while the
       pointer is off the canvas, so the two never render together. */
    #wrap #fs { cursor: default; }
    /* The pointer belongs to the mouse alone (docs/CURSOR_INPUT_CONTRACT.md): while the keyboard, a
       controller or touch owns the interface the hardware cursor is hidden everywhere on the page,
       the fullscreen button and the letterbox included, until the mouse meaningfully moves. */
    body[data-imode]:not([data-imode="mouse"]),
    body[data-imode]:not([data-imode="mouse"]) * { cursor: none !important; }
  </style>
</head>
<body>
  <div id="safeprobe"></div>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
    <input type="text" id="nameInput" maxlength="16" autocomplete="off" spellcheck="false" />
    <button id="fs" type="button">⛶ fullscreen</button>
    <div id="lockhint">click to capture mouse</div>
    <div id="hint"></div>
  </div>
  <div id="boot" role="status" aria-live="polite">
    <div class="mark" aria-label="TEAR">T E A R</div>
    <div class="line" aria-hidden="true"></div>
    <p class="error">TEAR couldn't start. Reload the page to try again.<br />If it keeps happening, clear this site's data or try another browser.</p>
  </div>

  <!-- TEAR_ENTRYPOINT -->
</body>
</html>
